  <path d="M164.31,140.2h94.16v-18.44h-94.16c-5.09,0-9.22,4.13-9.22,9.22s4.13,9.22,9.22,9.22Z"/>
  <path d="M111.26,258.48v-75.33c0-2.8,2.27-5.06,5.06-5.06h120.36c1.84,0,3.35,1.51,3.35,3.35v17.01c0,1.84-1.51,3.35-3.35,3.35h-62.41c-6.08,0-11.08,4.18-12.16,10.16-1.09,6,2.72,11.85,8.43,14.01l61.41,32.52h26.53v-9.66l-51.07-28.59h32.25c10.39,0,18.82-8.43,18.82-18.82v-22.95c0-10.39-8.42-18.82-18.82-18.82h-123.34c-12.98,0-23.5,10.52-23.5,23.5v75.33h18.44Z"/>
