<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon del monograma MR. Mismo trazado que favicon.ico; lo unico que cambia
  es el color, y lo decide el navegador:

    tema claro  -> #272727 (tinta)
    tema oscuro -> #eec84e (gold, el mismo token que tailwind.config.ts)

  El .ico es tinta sobre transparente, asi que en una pestana oscura el
  monograma se comia el fondo y desaparecia. Un .ico no puede reaccionar al
  tema; un SVG si, con la media query aqui dentro. favicon.ico sigue declarado
  detras como respaldo para quien no soporte SVG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304.47 304.47">
  <style>
    path { fill: #272727; }
    @media (prefers-color-scheme: dark) {
      path { fill: #eec84e; }
    }
  </style>
